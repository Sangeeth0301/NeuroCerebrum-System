# Install once:  pre-commit install
# Run on all files:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]
        exclude: ^ref/
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests|scripts|app)/
      - id: ruff-format
        files: ^(src|tests|scripts|app)/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: ^notebooks/

  # Block accidental commits of EEG data files.
  - repo: local
    hooks:
      - id: no-eeg-data
        name: block EEG data files (TUSZ data use agreement)
        entry: EEG data files must not be committed
        language: fail
        files: \.(edf|EDF|bdf|BDF)$
