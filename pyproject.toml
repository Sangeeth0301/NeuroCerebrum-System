[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromech"
dynamic = ["version"]
description = "NeuroMech-Warn: graph neural-mass dynamics for earlier seizure forecasting and detection on scalp EEG."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "NeuroMech-Warn contributors" }]
keywords = ["EEG", "epilepsy", "seizure forecasting", "neural mass model", "TUSZ"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Light core so the package imports and tests run anywhere (CI, laptops).
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# EEG / ECG signal processing (P1–P4)
eeg = [
  "mne>=1.7",
  "mne-connectivity>=0.7",
  "pyedflib>=0.1.37",
  "specparam>=2.0.0rc1",
  "neurokit2>=0.2.9",
  "pyarrow>=15.0",
  "h5py>=3.10",
]
# Deep learning, neural ODE, graphs, simulation-based inference (P5–P8)
ml = [
  "torch>=2.3",
  "torch-geometric>=2.5",
  "torchdiffeq>=0.2.4",
  "sbi>=0.23",
  "pycox>=0.3",
  "scikit-learn>=1.4",
  "catboost>=1.2",
]
# Experiment tracking
track = ["mlflow>=2.12"]
# Dashboard and figures (P10)
viz = [
  "matplotlib>=3.8",
  "plotly>=5.20",
  "streamlit>=1.35",
  "jinja2>=3.1",
]
# Deployment (P11)
deploy = ["onnx>=1.16", "onnxruntime>=1.18"]
# Development tools
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
all = ["neuromech[eeg,ml,track,viz,deploy]"]

[project.urls]
Repository = "https://github.com/Sangeeth0301/NeuroCerebrum-System"

[tool.setuptools.dynamic]
version = { attr = "neuromech.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests",
  "data: tests that need the real TUSZ dataset (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "DOCS", "research", "ref"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["neuromech"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]
